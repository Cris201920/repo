# Sistema do escritório + HTTPS automático (Caddy). Usado pelo install.sh.
services:
  app:
    build: ..
    restart: unless-stopped
    env_file: .env
    environment:
      DATA_DIR: /data
      COOKIE_SECURE: "1"
      TRUST_PROXY: "1"
      PORT: "3000"
    volumes:
      - ./data:/data
    expose:
      - "3000"

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMINIO: ${DOMINIO}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app

volumes:
  caddy_data: {}
  caddy_config: {}
