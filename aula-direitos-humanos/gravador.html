<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Gravador de narração</title>
<style>
:root{--bg:#0b1b3a;--panel:#152e5c;--gold:#c9a24b;--txt:#fff;--mut:#9aa6bd}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--txt);font:18px/1.5 system-ui,sans-serif}
header{padding:16px;position:sticky;top:0;background:var(--bg);border-bottom:1px solid #2a3b5e;z-index:2}
h1{margin:0;font-size:20px;color:var(--gold)}p.s{margin:4px 0 0;color:var(--mut);font-size:15px}
.scene{margin:16px;padding:16px;background:var(--panel);border-radius:14px;border:1px solid #2a3b5e}
.scene h2{margin:0 0 8px;font-size:15px;color:var(--gold);letter-spacing:.06em}
.txt{font-size:26px;line-height:1.45;font-family:Georgia,serif}.txt p{margin:.4em 0}.pause{color:var(--mut);font-style:italic;font-size:18px}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;align-items:center}
button,a.dl{background:var(--gold);color:#0b1b3a;border:0;border-radius:10px;padding:10px 16px;font-weight:700;font-size:16px;cursor:pointer;text-decoration:none}
button.sec{background:#2a3b5e;color:#fff}button.rec{background:#d66}.ok{color:#7ecd9c;font-size:14px}
audio{height:36px}
</style></head><body>
<header><h1>Gravador de narração — Direitos Humanos</h1>
<p class="s">Grave cada cena lendo o texto em ritmo calmo, de professor. Nas “pausas”, fique em silêncio pelo tempo indicado. Baixe cada arquivo e coloque em <b>voz/</b> com o nome mostrado (ex.: <b>conceito.webm</b>). Use fones e um lugar silencioso.</p></header>
<main id="m"></main>
<script>
const DATA=[{"id": "abertura", "bloco": "ABERTURA", "segs": [{"t": "Olá! Nesta aula, vamos entender os Direitos Humanos de um jeito claro: para compreender a lógica, e não apenas decorar.", "pausa": 0}, {"t": "Ao final, você vai diferenciar os termos que confundem, memorizar as classificações e reconhecer como o tema é cobrado em prova.", "pausa": 0}]}, {"id": "conceito", "bloco": "BLOCO 1 · CONCEITO", "segs": [{"t": "Primeiro, o conceito. Direitos Humanos são o conjunto de direitos indispensáveis a uma vida pautada na liberdade, na igualdade e na dignidade.", "pausa": 0}, {"t": "Liberdade: por exemplo, poder expressar uma opinião.", "pausa": 0}, {"t": "Igualdade: ser tratado de forma igual perante a lei.", "pausa": 0}, {"t": "Dignidade: não ser submetido a tratamento desumano.", "pausa": 0}, {"t": "Esses direitos protegem as pessoas e asseguram as condições fundamentais para uma existência digna.", "pausa": 0}]}, {"id": "estrutura1", "bloco": "BLOCO 2 · ESTRUTURA", "segs": [{"t": "Segundo ponto: a estrutura. Um direito pode ser compreendido de quatro maneiras. Elas não são sinônimas: são estruturas diferentes.", "pausa": 0}, {"t": "Direito-pretensão: é a possibilidade de exigir de alguém uma conduta ou uma prestação. Por exemplo, a pretensão de receber uma prestação de saúde, quando presentes os requisitos jurídicos.", "pausa": 0}, {"t": "Direito-liberdade: protege uma esfera de autonomia, permitindo agir sem interferências indevidas. Por exemplo, manifestar uma opinião, dentro dos limites jurídicos.", "pausa": 0}]}, {"id": "estrutura2", "bloco": "BLOCO 2 · ESTRUTURA", "segs": [{"t": "Direito-poder: é a possibilidade de exercer uma competência e produzir efeitos jurídicos por meio de um ato reconhecido pelo Direito. Por exemplo, votar, observados os requisitos legais.", "pausa": 0}, {"t": "Direito-imunidade: protege a pessoa contra certas formas de interferência, ou de sujeição ao poder de outra pessoa ou autoridade.", "pausa": 0}, {"t": "Para fixar: a pretensão exige, a liberdade protege a autonomia, o poder produz efeitos jurídicos e a imunidade protege contra interferência.", "pausa": 0.6}]}, {"id": "cumprimento1", "bloco": "BLOCO 3 · CUMPRIMENTO", "segs": [{"t": "Terceiro ponto: as maneiras de cumprimento. Vamos olhar por dois ângulos. O primeiro é o ponto de vista subjetivo: quem tem a incumbência de respeitar, proteger ou concretizar o direito.", "pausa": 0}, {"t": "A incumbência pode ser do Estado: como a saúde e a segurança pública.", "pausa": 0}, {"t": "Pode ser de um particular: como o empregador, que não pode discriminar um trabalhador.", "pausa": 0}, {"t": "Ou de ambos: como na proteção da criança, que é dever da família, da sociedade e do Estado.", "pausa": 0}, {"t": "Ou seja: proteger os Direitos Humanos não é responsabilidade exclusiva do Estado.", "pausa": 0}]}, {"id": "cumprimento2", "bloco": "BLOCO 3 · CUMPRIMENTO", "segs": [{"t": "O segundo ângulo é o ponto de vista objetivo: qual conduta é exigida. A conduta ativa exige uma ação, uma prestação ou uma medida para efetivar o direito.", "pausa": 0}, {"t": "Já a conduta passiva exige abstenção: alguém deve deixar de praticar uma interferência indevida.", "pausa": 0}, {"t": "Resumindo, de forma didática: subjetivo é quem tem a incumbência; objetivo é qual conduta é exigida.", "pausa": 0}, {"t": "É uma síntese para estudo, que preserva o sentido jurídico dos conceitos.", "pausa": 0.5}]}, {"id": "conteudo", "bloco": "BLOCO 4 · CONTEÚDO", "segs": [{"t": "Quarto ponto: o conteúdo. Os Direitos Humanos representam valores essenciais, retratados nas Constituições e nos tratados internacionais: dignidade, liberdade, igualdade e proteção da pessoa humana.", "pausa": 0}, {"t": "Essa proteção pode aparecer de forma expressa, escrita no texto jurídico.", "pausa": 0}, {"t": "Ou de forma implícita, decorrente da interpretação desse texto.", "pausa": 0}]}, {"id": "fundamentalidade", "bloco": "BLOCO 5 · FUNDAMENTALIDADE", "segs": [{"t": "Quinto ponto, um dos mais importantes: a fundamentalidade formal e a fundamentalidade material.", "pausa": 0}, {"t": "A fundamentalidade formal se relaciona ao reconhecimento do direito em um instrumento jurídico, como a Constituição ou um tratado internacional, conforme o contexto considerado. É a dimensão formal do reconhecimento normativo.", "pausa": 0}, {"t": "A fundamentalidade material se relaciona ao conteúdo: o direito é indispensável para a promoção da dignidade humana?", "pausa": 0}, {"t": "Para memorizar: formal, reconhecimento jurídico; material, importância do conteúdo para a dignidade humana. Atenção: são atalhos de memória, não definições exaustivas.", "pausa": 0.6}]}, {"id": "marcas1", "bloco": "BLOCO 6 · MARCAS DISTINTIVAS", "segs": [{"t": "Sexto ponto: as marcas distintivas. A primeira é a universalidade: os Direitos Humanos são reconhecidos como direitos de todas as pessoas, sem que a proteção dependa de privilégios pessoais. Direitos de todos.", "pausa": 0}, {"t": "A segunda é a essencialidade: eles representam valores indispensáveis à pessoa humana, que devem ser protegidos.", "pausa": 0}]}, {"id": "marcas2", "bloco": "BLOCO 6 · MARCAS DISTINTIVAS", "segs": [{"t": "A terceira é a superioridade normativa, também chamada de preferenciabilidade: a especial importância normativa atribuída aos Direitos Humanos, no contexto constitucional e internacional.", "pausa": 0}, {"t": "Atenção: isso não significa que toda norma de Direitos Humanos prevalece automaticamente sobre qualquer outra. Conflitos normativos exigem análise jurídica adequada. É uma proteção normativa especial.", "pausa": 0}]}, {"id": "marcas3", "bloco": "BLOCO 6 · MARCAS DISTINTIVAS", "segs": [{"t": "A quarta é a reciprocidade: todos têm direitos, e os deveres de respeito e proteção não se limitam ao Estado. A coletividade e os particulares também podem ter responsabilidades.", "pausa": 0}, {"t": "Fixe as quatro marcas: universalidade, essencialidade, superioridade normativa e reciprocidade.", "pausa": 0.6}]}, {"id": "consequencias1", "bloco": "BLOCO 7 · CONSEQUÊNCIAS", "segs": [{"t": "Sétimo ponto: as consequências de uma sociedade pautada na defesa dos Direitos Humanos. A primeira é o reconhecimento do direito a ter direitos.", "pausa": 0}, {"t": "Cada pessoa deve ser reconhecida como sujeito de direitos e titular de proteção jurídica. A dignidade não depende de riqueza, de posição social ou de privilégios.", "pausa": 0}]}, {"id": "consequencias2", "bloco": "BLOCO 7 · CONSEQUÊNCIAS", "segs": [{"t": "A segunda consequência é a convivência e a colisão de direitos. Os direitos de uma pessoa convivem com os direitos das demais.", "pausa": 0}, {"t": "Imagine a liberdade de expressão em tensão com a proteção da honra ou da privacidade de outra pessoa.", "pausa": 0}, {"t": "Nesse caso, o Direito estabelece limites, pondera os interesses e identifica qual proteção deve prevalecer nas circunstâncias concretas, conforme os critérios jurídicos aplicáveis.", "pausa": 0}, {"t": "E o conflito não faz um dos direitos deixar de existir. Os direitos devem conviver com os direitos das outras pessoas.", "pausa": 0.6}]}, {"id": "quadro", "bloco": "REVISÃO FINAL", "segs": [{"t": "Hora de revisar. Conceito: liberdade, igualdade e dignidade. Estrutura: pretensão, liberdade, poder e imunidade.", "pausa": 0}, {"t": "Cumprimento subjetivo: Estado, particular ou ambos. Cumprimento objetivo: conduta ativa ou passiva.", "pausa": 0}, {"t": "Conteúdo: valores essenciais reconhecidos juridicamente. Fundamentalidade formal: reconhecimento formal. Material: conteúdo essencial à dignidade.", "pausa": 0}, {"t": "Marcas distintivas: universalidade, essencialidade, superioridade normativa e reciprocidade. Consequências: direito a ter direitos e convivência entre direitos.", "pausa": 0.6}]}, {"id": "quiz", "bloco": "REVISÃO ATIVA", "segs": [{"t": "Agora, revisão ativa. Quais são os três valores centrais do conceito de Direitos Humanos?", "pausa": 0}, {"t": "", "pausa": 2.2}, {"t": "Liberdade, igualdade e dignidade.", "pausa": 0}, {"t": "Quais são as quatro estruturas dos Direitos Humanos?", "pausa": 0}, {"t": "", "pausa": 2.2}, {"t": "Pretensão, liberdade, poder e imunidade.", "pausa": 0}, {"t": "Qual é a diferença entre o ponto de vista subjetivo e o objetivo, quanto ao cumprimento?", "pausa": 0}, {"t": "", "pausa": 2.6}, {"t": "Subjetivo: quem tem a incumbência. Objetivo: qual conduta é exigida.", "pausa": 0}, {"t": "Qual é a diferença entre a fundamentalidade formal e a material?", "pausa": 0}, {"t": "", "pausa": 2.4}, {"t": "Formal: reconhecimento jurídico. Material: conteúdo essencial à dignidade.", "pausa": 0}, {"t": "Quais são as quatro marcas distintivas dos Direitos Humanos?", "pausa": 0}, {"t": "", "pausa": 2.4}, {"t": "Universalidade, essencialidade, superioridade normativa e reciprocidade.", "pausa": 0.5}]}, {"id": "final", "bloco": "ENCERRAMENTO", "segs": [{"t": "Mais importante do que decorar os termos é compreender a lógica dos Direitos Humanos:", "pausa": 0}, {"t": "proteger a dignidade, reconhecer cada pessoa como titular de direitos", "pausa": 0}, {"t": "e permitir a convivência respeitosa entre todos.", "pausa": 0}, {"t": "Bons estudos!", "pausa": 1.2}]}];
const m=document.getElementById('m');
DATA.forEach(sc=>{
  const d=document.createElement('section');d.className='scene';
  d.innerHTML=`<h2>${sc.bloco} · arquivo: <b>${sc.id}</b></h2><div class="txt">`+sc.segs.map(s=>s.t?`<p>${s.t}</p>`:`<p class="pause">(silêncio de ${s.pausa} s)</p>`).join('')+`</div>
  <div class="bar"><button class="rec">● Gravar</button><button class="sec" disabled>■ Parar</button><span class="ok"></span></div>
  <div class="bar"><audio controls hidden></audio><a class="dl" hidden>Baixar</a></div>`;
  m.appendChild(d);
  const [bR,bS]=d.querySelectorAll('button'),au=d.querySelector('audio'),dl=d.querySelector('a.dl'),ok=d.querySelector('.ok');
  let mr,ch=[];
  bR.onclick=async()=>{
    try{const st=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:false,noiseSuppression:true}});
      mr=new MediaRecorder(st);ch=[];mr.ondataavailable=e=>ch.push(e.data);
      mr.onstop=()=>{st.getTracks().forEach(t=>t.stop());const b=new Blob(ch,{type:mr.mimeType});const ext=mr.mimeType.includes('ogg')?'ogg':mr.mimeType.includes('mp4')?'m4a':'webm';
        au.src=URL.createObjectURL(b);au.hidden=false;dl.href=au.src;dl.download=sc.id+'.'+ext;dl.textContent='Baixar '+sc.id+'.'+ext;dl.hidden=false;ok.textContent='Gravado ✔';};
      mr.start();bR.disabled=true;bS.disabled=false;ok.textContent='Gravando…';
    }catch(e){ok.textContent='Sem acesso ao microfone: '+e.message}
  };
  bS.onclick=()=>{mr.stop();bR.disabled=false;bS.disabled=true;};
});
</script></body></html>
