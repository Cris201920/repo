# Blueprint do Render (https://render.com): cria o site com disco persistente e HTTPS automático.
# Publicar: no Render, "New +" > "Blueprint" > escolha este repositório e a branch abaixo.
services:
  - type: web
    name: advocacia
    runtime: docker
    branch: ccr-54c78786-wq98am   # depois de integrar na "main", troque para main
    rootDir: sistema-advocacia
    plan: starter                 # disco persistente exige plano pago
    healthCheckPath: /healthz
    autoDeploy: true
    disk:
      name: dados
      mountPath: /data
      sizeGB: 10
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false               # você informa no painel do Render
      - key: ANTHROPIC_MODEL
        value: claude-sonnet-5-5
      - key: DATA_KEY
        generateValue: true       # chave de criptografia dos documentos — ANOTE e guarde uma cópia segura
